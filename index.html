<!DOCTYPE html>
<html>

<head>

    <title>AI EV Fleet Optimization</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header>

    <h1>⚡ AI EV Fleet Optimization</h1>

    <p>
        Intelligent Energy & Fleet Management
    </p>

</header>


<div class="container">


    <div class="cards">

        <div class="card">
            <h3>Total EVs</h3>
            <h2 id="total">--</h2>
        </div>

        <div class="card">
            <h3>Available</h3>
            <h2 id="available">--</h2>
        </div>

        <div class="card">
            <h3>Low Battery</h3>
            <h2 id="lowBattery">--</h2>
        </div>

        <div class="card">
            <h3>Cheapest Price</h3>
            <h2 id="price">--</h2>
        </div>

    </div>


    <div class="section">

        <h2>🚗 Fleet Status</h2>

        <table>

            <thead>

                <tr>
                    <th>Vehicle</th>
                    <th>SOC</th>
                    <th>SOH</th>
                    <th>Status</th>
                </tr>

            </thead>

            <tbody id="fleetTable">

            </tbody>

        </table>

    </div>


    <div class="section">

        <h2>🔌 Charging Recommendations</h2>

        <div id="recommendations">

        </div>

    </div>


    <div class="section">

        <h2>🤖 Gemini AI Analysis</h2>

        <button onclick="getAIAnalysis()">

            Generate AI Analysis

        </button>

        <div id="aiResult">

        </div>

    </div>


</div>


<script src="script.js"></script>

</body>

</html>
